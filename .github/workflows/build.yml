name: Compilar PKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps3dev/ps3dev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependências
        run: |
          apt-get update
          apt-get install -y python3 make git
      - name: Compilar
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV/psl1ght
          export PATH=$PATH:$PS3DEV/bin:$PSL1GHT/bin
          make
      - name: Enviar PKG
        uses: actions/upload-artifact@v4
        with:
          name: motoloop-pkg
          path: "*.pkg"