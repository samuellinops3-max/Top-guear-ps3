name: Build PS3 PKG

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps3dev/ps3dev:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PKG
        run: |
          export PSL1GHT=$PS3DEV/psl1ght
          export PATH=$PS3DEV/ppu/bin:$PATH
          make pkg

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: PouPS3-pkg
          path: "*.pkg"
          if-no-files-found: error