name: Build PS3 PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ps3dev/ps3dev:latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Compilar jogo e gerar PKG
        run: |
          make pkg

      - name: Enviar arquivo PKG pronto
        uses: actions/upload-artifact@v4
        with:
          name: pou-ps3-pkg
          path: "*.pkg"
