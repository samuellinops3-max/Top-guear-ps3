name: Build PS3 PKG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps3dev/psl1ght:latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Compilar PKG
        run: make pkg

      - name: Salvar Artefato PKG
        uses: actions/upload-artifact@v4
        with:
          name: slither-ps3-pkg
          path: "*.pkg"
