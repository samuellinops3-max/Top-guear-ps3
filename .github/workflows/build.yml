name: Build PS3 - ASTRONOMIA QUIZ PS3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: psl1ght/psl1ght:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: |
          make clean || true
          make
          ls -lh
          mkdir -p pkg
          cp *.elf pkg/ || true
          cp *.self pkg/ || true
      - name: Salvar PKG
        uses: actions/upload-artifact@v4
        with:
          name: ASTRONOMIA_QUIZ_PS3
          path: pkg/